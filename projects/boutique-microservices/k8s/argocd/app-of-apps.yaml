apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gitcliff/microservices-devops-stack.git
    targetRevision: HEAD
    path: projects/boutique-microservices/k8s/argocd/apps/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
