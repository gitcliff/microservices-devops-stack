apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: boutique
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/gitcliff/microservices-devops-stack.git
    targetRevision: HEAD
    path: projects/boutique-microservices/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
