apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: boutique.local
      http:
        paths:
          # API traffic goes directly to the gateway — frontend uses serve (no nginx proxy)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3001
          # All other traffic goes to the frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    # Grafana and Prometheus are now deployed via Helm in the monitoring namespace.
    # Access them through their own services/ingress in that namespace.
