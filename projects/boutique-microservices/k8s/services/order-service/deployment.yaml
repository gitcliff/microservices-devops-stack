apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command: ['sh', '-c', 'until pg_isready -h postgres -p 5432 -U postgres; do echo "waiting for postgres..."; sleep 2; done']
      containers:
        - name: order-service
          image: boutique/order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: NODE_ENV
            - name: PORT
              value: "3004"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://postgres:$(DB_PASSWORD)@postgres:5432/orders_db"
            - name: PRODUCTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: PRODUCTS_SERVICE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: CORS_ORIGINS
          readinessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
