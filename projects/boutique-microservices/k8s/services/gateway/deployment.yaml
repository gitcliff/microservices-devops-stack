apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z auth 3002; do echo "waiting for auth service..."; sleep 2; done']
        - name: wait-for-product-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z product-service 3003; do echo "waiting for product-service..."; sleep 2; done']
      containers:
        - name: gateway
          image: boutique/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: NODE_ENV
            - name: GATEWAY_PORT
              value: "3001"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: AUTH_SERVICE_URL
            - name: PRODUCTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: PRODUCTS_SERVICE_URL
            - name: ORDERS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: ORDERS_SERVICE_URL
            - name: USERS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: USERS_SERVICE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: CORS_ORIGINS
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
