name: Build, Scan & Publish

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: every push that lands on main (post-PR-merge) and on-demand
# dispatch. Publishing from untrusted branches is not supported.
#
# Trust boundary: AWS credentials (via OIDC) are exposed only in the 'publish'
# job, which runs after all security gates have passed.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    # Ignore manifest-only commits from this workflow to prevent infinite loops.
    paths-ignore:
      - "k8s/overlays/*/kustomization.yaml"
  workflow_dispatch:

# Prevent two publish runs from racing on the same ref.
# cancel-in-progress: false — a running publish must never be interrupted;
# a partial push would leave the registry in an inconsistent state.
concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

# Grant elevated permissions only to the jobs that need them.
permissions:
  contents: read

env:
  # Full 40-character SHA with prefix — unique, unambiguous, and directly
  # traceable to the source commit. Never use 'latest' as a deployment tag.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ============================================================
  # 1. BUILD  →  SBOM  →  VULNERABILITY GATE
  #
  # Each service is built exactly once. The SBOM is generated from
  # the final image BEFORE the vulnerability gate so that evidence
  # is retained even when the gate blocks publication.
  #
  # The scanned image is saved as a tar archive and uploaded as an
  # artifact. The publish job loads and pushes that same archive,
  # guaranteeing the published image is identical to the scanned one.
  # ============================================================
  build-scan-sbom:
    name: Build, SBOM & Scan (${{ matrix.image }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      # Allow all matrix entries to complete so every service is
      # diagnosed independently before the job result is determined.
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # ── Frontend ──────────────────────────────────────────
          # Standalone build context; no shared/ dependency.
          - image: boutique-frontend
            ecr_name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

          # ── Backend services ──────────────────────────────────
          # All backend services use backend/ as their build context
          # so the shared/ library is reachable from each Dockerfile.
          - image: boutique-gateway
            ecr_name: gateway
            context: backend
            dockerfile: backend/services/gateway/Dockerfile

          - image: boutique-auth
            ecr_name: auth
            context: backend
            dockerfile: backend/services/auth/Dockerfile

          - image: boutique-product-service
            ecr_name: product-service
            context: backend
            dockerfile: backend/services/product-service/Dockerfile

          # order-service is a plain JavaScript service (no TypeScript build).
          - image: boutique-order-service
            ecr_name: order-service
            context: backend
            dockerfile: backend/services/order-service/Dockerfile

          - image: boutique-orders
            ecr_name: orders
            context: backend
            dockerfile: backend/services/orders/Dockerfile

          - image: boutique-user-service
            ecr_name: user-service
            context: backend
            dockerfile: backend/services/user-service/Dockerfile

    steps:
      # Check out the trusted revision that triggered the workflow.
      - name: Checkout trusted source revision
        uses: actions/checkout@v4

      # ── BUILD ────────────────────────────────────────────────
      # Build the final production image into the local Docker daemon
      # so that subsequent scan and save steps operate on exactly the
      # same image layer stack.
      - name: Build image
        run: |
          docker build \
            --tag "${{ matrix.image }}:${{ env.IMAGE_TAG }}" \
            --file "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"

      # ── SBOM ────────────────────────────────────────────────
      # Generate a CycloneDX JSON SBOM from the built image.
      # Runs BEFORE the vulnerability gate so the SBOM is always
      # retained as evidence even when the gate blocks publication.
      # The SBOM describes package inventory independent of whether
      # those packages have known CVEs today.
      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate SBOM (CycloneDX JSON)
        # aquasecurity/trivy-action 0.35.0 — keep in sync with pr-validation.yml
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: "${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          format: cyclonedx
          output: "sbom/${{ matrix.image }}-${{ env.IMAGE_TAG }}.cdx.json"
          # exit-code 0: SBOM generation is evidence collection, not a gate.
          # Vulnerabilities are enforced in the dedicated scan step below.
          exit-code: "0"

      # Upload unconditionally (if: always()) so evidence is retained
      # even when the vulnerability gate later fails.
      # if-no-files-found: error ensures a silently missing SBOM causes
      # a visible failure rather than a misleading green status.
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "sbom-${{ matrix.image }}"
          path: "sbom/${{ matrix.image }}-${{ env.IMAGE_TAG }}.cdx.json"
          retention-days: 30
          if-no-files-found: error

      # ── VULNERABILITY GATE ───────────────────────────────────
      # Policy (severity HIGH/CRITICAL, ignore-unfixed, ignorefile) is
      # defined in .trivy.yaml and shared with pr-validation.yml so
      # both gates enforce identical rules. See .trivy.yaml for rationale.
      #
      # skip-dirs is intentionally absent. Excluding system library
      # paths hides relevant OS packages and masks real risk.
      - name: Scan image for vulnerabilities (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: "${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          format: table
          scanners: vuln,secret
          trivy-config: .trivy.yaml
          exit-code: "1"

      # ── PRESERVE SCANNED IMAGE ───────────────────────────────
      # Save the exact image that passed the gate as a tar archive.
      # This step runs only when the vulnerability gate above passes.
      # The publish job loads and pushes this archive, not a rebuild.
      - name: Save scanned image as archive
        run: |
          mkdir -p /tmp/docker-images
          docker save \
            "${{ matrix.image }}:${{ env.IMAGE_TAG }}" \
            -o "/tmp/docker-images/${{ matrix.image }}.tar"

      - name: Upload image archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: "image-${{ matrix.image }}"
          path: "/tmp/docker-images/${{ matrix.image }}.tar"
          # Short retention: only needed for the publish job in this run.
          retention-days: 1
          if-no-files-found: error

  # ============================================================
  # 2. PUBLISH TO AMAZON ECR & CAPTURE IMAGE DIGESTS
  #
  # Downloads the exact image archive that passed the scan gate
  # and pushes it to Amazon ECR. AWS credentials are obtained via
  # OIDC — no long-lived access keys.
  #
  # This job runs only when ALL build-scan-sbom matrix entries
  # succeed. One failing vulnerability gate blocks all publishes,
  # ensuring a cohesive, fully-vetted release.
  # ============================================================
  publish:
    name: Publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build-scan-sbom

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Mirror the image list from build-scan-sbom exactly so artifact
        # names match between the upload and download steps.
        include:
          - image: boutique-frontend
            ecr_name: frontend
          - image: boutique-gateway
            ecr_name: gateway
          - image: boutique-auth
            ecr_name: auth
          - image: boutique-product-service
            ecr_name: product-service
          - image: boutique-order-service
            ecr_name: order-service
          - image: boutique-orders
            ecr_name: orders
          - image: boutique-user-service
            ecr_name: user-service

    steps:
      # No code checkout needed — this job works exclusively with
      # the pre-built, pre-scanned archive from build-scan-sbom.
      - name: Download scanned image archive
        uses: actions/download-artifact@v4
        with:
          name: "image-${{ matrix.image }}"
          path: /tmp/docker-images

      - name: Load image into local Docker daemon
        run: docker load -i "/tmp/docker-images/${{ matrix.image }}.tar"

      # - name: Inspect GitHub OIDC claims
      #   shell: bash
      #   run: |
      #     TOKEN=$(curl -sS \
      #       -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
      #       | jq -r '.value')
      
      #     export TOKEN
      
      #     python3 - <<'PY'
      #     import os, json, base64
      
      #     token = os.environ["TOKEN"]
      #     payload = token.split(".")[1]
      #     payload += "=" * (-len(payload) % 4)
      
      #     claims = json.loads(base64.urlsafe_b64decode(payload))
      
      #     print(json.dumps({
      #         "iss": claims.get("iss"),
      #         "aud": claims.get("aud"),
      #         "sub": claims.get("sub")
      #     }, indent=2))
      #     PY

      # Authenticate to AWS via OIDC. The GitHub Actions OIDC provider
      # issues a short-lived token that is exchanged for temporary AWS
      # credentials scoped to the ECR push role.
      #
      # Required configuration (GitHub repo Settings):
      #   Secrets  → Actions:  AWS_ROLE_ARN  (IAM role ARN from Terraform output)
      #   Variables → Actions:  AWS_REGION    (e.g. us-east-1)
      #
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      # Tag with the immutable SHA-based tag and push to ECR.
      # After push, capture the image digest (sha256:...) which is the
      # content-addressed, truly immutable identifier used for deployments.
      - name: Push image to ECR and capture digest
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          REMOTE="${REGISTRY}/${{ matrix.ecr_name }}:${{ env.IMAGE_TAG }}"
          docker tag "${{ matrix.image }}:${{ env.IMAGE_TAG }}" "$REMOTE"
          docker push "$REMOTE"

          # Extract the image digest from the pushed image.
          # RepoDigests is populated by Docker after a successful push.
          # The digest is a content-addressed sha256 hash — unlike tags,
          # it cannot be overwritten or reassigned.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE" \
                   | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Write a one-line record: <ecr_name> <sha256:hash>
      # Uploaded as an artifact so the update-manifests job can collect
      # digests from all matrix entries reliably.
      - name: Record image digest
        run: |
          mkdir -p /tmp/digests
          printf '%s %s\n' "${{ matrix.ecr_name }}" "${{ steps.push.outputs.digest }}" \
            > "/tmp/digests/${{ matrix.ecr_name }}.txt"

      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: "digest-${{ matrix.ecr_name }}"
          path: "/tmp/digests/${{ matrix.ecr_name }}.txt"
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # 3. UPDATE KUSTOMIZATION WITH REGISTRY & IMMUTABLE DIGESTS
  #
  # Collects per-service digests, uses `kustomize edit set image`
  # to update the dev overlay with ECR URIs and digests, then
  # commits and pushes. ArgoCD detects the commit and reconciles
  # the cluster state automatically.
  #
  # Only dev is updated automatically. Promote to prod by copying
  # the digest values or running a separate promotion workflow.
  # ============================================================
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Download all digest records
        uses: actions/download-artifact@v4
        with:
          pattern: "digest-*"
          path: /tmp/digests
          merge-multiple: true

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update dev overlay with ECR image digests
        env:
          REGISTRY: ${{ format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, vars.AWS_REGION) }}
        run: |
          cd k8s/overlays/dev
          for f in /tmp/digests/*.txt; do
            [ -f "$f" ] || continue
            repo=$(awk '{print $1}' "$f")
            digest=$(awk '{print $2}' "$f")

            if [ -z "$repo" ] || [ -z "$digest" ]; then
              echo "::warning::Skipping malformed digest record: $f"
              continue
            fi

            kustomize edit set image \
              "boutique/${repo}=${REGISTRY}/${repo}@${digest}"
            echo "  ✓ ${repo} → ${digest}"
          done

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml

          # Only commit if there are actual changes.
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(release): bump dev images to ${{ env.IMAGE_TAG }}

          Automated by Build, Scan & Publish workflow.
          Source commit: ${{ github.sha }}"
            git push origin main
          fi

  # ============================================================
  # 4. RELEASE SUMMARY
  #
  # Writes a structured workflow summary with ECR URIs and digests.
  # Always runs so that partial failures are visible.
  # ============================================================
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [publish, update-manifests]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Download all digest records
        uses: actions/download-artifact@v4
        with:
          pattern: "digest-*"
          path: /tmp/digests
          merge-multiple: true
        continue-on-error: true

      - name: Write workflow summary
        run: |
          {
            echo "## Boutique Build & Publish Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit  | \`${{ github.sha }}\` |"
            echo "| Tag     | \`${{ env.IMAGE_TAG }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Actor   | \`${{ github.actor }}\` |"
            echo ""
            echo "### Published Images"
            echo ""
            echo "| ECR Repository | Digest |"
            echo "|----------------|--------|"
            for f in /tmp/digests/*.txt; do
              [ -f "$f" ] || continue
              repo=$(awk '{print $1}' "$f" 2>/dev/null || echo "unknown")
              digest=$(awk '{print $2}' "$f" 2>/dev/null || echo "unavailable")
              echo "| \`${repo}\` | \`${digest}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
