name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

# ──────────────────────────────────────────────────────────────
# Jobs run in two waves:
#   Wave 1 (parallel): lint | sast | dependency-scan
#   Wave 2 (parallel): unit-tests
#   Wave 3:            sonarqube-gate  (needs coverage artifacts)
# ──────────────────────────────────────────────────────────────

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    name: Lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Lint
        run: npm run lint --prefix ${{ matrix.dir }}

  # ============================================================
  # 2. UNIT TESTS + COVERAGE  (80 % threshold enforced in jest)
  # ============================================================
  unit-tests:
    name: Unit Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Run tests with coverage
        run: npm run test:coverage --prefix ${{ matrix.dir }}
        env:
          CI: true

      # Upload lcov for SonarQube
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.dir }}/coverage/
          retention-days: 1

  # ============================================================
  # 3. SONARQUBE ANALYSIS + QUALITY GATE
  #    Runs after unit-tests so coverage is available
  # ============================================================
  sonarqube-gate:
    name: SonarQube Quality Gate
    needs: unit-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by SonarQube

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: projects/boutique-microservices/frontend/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: projects/boutique-microservices/backend/coverage


      # Run analysis and upload results to SonarQube server
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Poll until the quality gate result is available (timeout 5 min)
      - name: SonarQube quality gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 4. SAST  —  Semgrep (runs in parallel with tests)
  # ============================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # required for SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        continue-on-error: true  # findings exit non-zero; don't abort the job
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
          generateSarif: "1"

      # Publish findings to GitHub Security → Code scanning alerts
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # 5. DEPENDENCY SCAN  —  Snyk (runs in parallel with tests)
  # ============================================================
  dependency-scan:
    name: Dependency Scan (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Snyk dependency scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --fail-on=upgradable
            --file=${{ matrix.dir }}/package.json
