name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

# ──────────────────────────────────────────────────────────────
# Jobs run in waves:
#   Wave 1 (parallel): lint/build | sast | dependency-scan | trivy-fs | docker-build
#   Wave 2 (parallel): unit-tests | integration-tests (needs lint)
#   Wave 3:            sonarqube-gate  (needs unit-tests coverage artifacts)
# ──────────────────────────────────────────────────────────────

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # Skip on forked PRs — GITHUB_TOKEN has limited scope and gitleaks-action
    # requires the GITLEAKS_LICENSE secret which is not available from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    name: Lint and Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Lint
        run: npm run lint --prefix ${{ matrix.dir }}

      - name: Check JavaScript syntax (plain .js files not compiled by tsc)
        if: ${{ matrix.project == 'backend' }}
        run: |
          find projects/boutique-microservices/backend/services \
            -name "*.js" \
            ! -path "*/node_modules/*" \
            ! -path "*/dist/*" \
            | xargs node --check

      - name: Build
        run: npm run build --prefix ${{ matrix.dir }}

  # ============================================================
  # 2. UNIT TESTS + COVERAGE  (80 % threshold enforced in jest)
  # ============================================================
  unit-tests:
    name: Unit Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Run tests with coverage
        run: npm run test:coverage --prefix ${{ matrix.dir }}
        env:
          CI: true

      # Upload lcov for SonarQube
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.dir }}/coverage/
          retention-days: 1

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v40

      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,config
          skip-dirs: "**/node_modules,/usr/local/lib/**,/usr/lib/**"
          trivyignores: .trivyignore
          exit-code: "1"

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: frontend
            context: projects/boutique-microservices/frontend
            dockerfile: projects/boutique-microservices/frontend/Dockerfile
          - image: gateway
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/gateway/Dockerfile
          - image: auth
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/auth/Dockerfile
          - image: product-service
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/product-service/Dockerfile
          - image: order-service
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/order-service/Dockerfile
          - image: orders
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/orders/Dockerfile
          - image: user-service
            context: projects/boutique-microservices/backend
            dockerfile: projects/boutique-microservices/backend/services/user-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image without publishing
        run: >-
          docker build
          --tag "boutique-${{ matrix.image }}:pr"
          --file "${{ matrix.dockerfile }}"
          "${{ matrix.context }}"

      - name: Scan image for OS and dependency CVEs
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: boutique-${{ matrix.image }}:pr
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          skip-dirs: "/usr/local/lib/**,/usr/lib/**"

  # ============================================================
  # 3. INTEGRATION SMOKE TESTS
  #    Starts postgres + auth + product-service via docker-compose and
  #    validates health, register/login, and product-list responses.
  #    Runs after lint so we only spin up services when the build is green.
  # ============================================================
  integration-tests:
    name: Integration Smoke Tests
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: projects/boutique-microservices

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start auth + product-service (and their postgres dependency)
        run: docker compose up --build -d auth product-service

      - name: Wait for auth service to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002/health && break
            echo "Waiting for auth (attempt $i/30)..."
            sleep 3
          done
          curl -sf http://localhost:3002/health

      - name: Wait for product-service to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3003/health && break
            echo "Waiting for product-service (attempt $i/30)..."
            sleep 3
          done
          curl -sf http://localhost:3003/health

      - name: Smoke — register new user
        run: |
          out=$(curl -sf -X POST http://localhost:3002/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.com","password":"ci-pass-123","firstName":"CI","lastName":"Test"}')
          echo "$out"
          echo "$out" | grep -q '"email"'

      - name: Smoke — login
        run: |
          out=$(curl -sf -X POST http://localhost:3002/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.com","password":"demo"}')
          echo "$out"
          echo "$out" | grep -q '"token"'

      - name: Smoke — list products
        run: |
          out=$(curl -sf 'http://localhost:3003/?limit=1')
          echo "$out"
          echo "$out" | grep -q '"id"'

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ============================================================
  # 4. SONARQUBE ANALYSIS + QUALITY GATE
  #    Runs after unit-tests so coverage is available
  # ============================================================
  sonarqube-gate:
    name: SonarQube Quality Gate
    needs: unit-tests
    runs-on: ubuntu-latest
    # Optional job — skipped on PRs unless RUN_SONAR_CI=true or on forked PRs
    # (SONAR_TOKEN unavailable). Branch protection enforces SonarCloud's own
    # PR status check separately; this Actions job is not the gate for that.
    if: >-
      (github.event_name != 'pull_request' || vars.RUN_SONAR_CI == 'true')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required by SonarQube

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: projects/boutique-microservices/frontend/coverage

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: projects/boutique-microservices/backend/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Poll until the quality gate result is available (timeout 15 min)
      - name: SonarQube quality gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 5. SAST  —  Semgrep (runs in parallel with tests)
  # ============================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # required for SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        continue-on-error: false 
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
          generateSarif: "1"

      # Publish findings to GitHub Security → Code scanning alerts
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # 6. DEPENDENCY SCAN  —  Snyk (runs in parallel with tests)
  # ============================================================
  dependency-scan:
    name: Dependency Scan (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Skip on forked PRs — SNYK_TOKEN is not available from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: frontend
            dir: projects/boutique-microservices/frontend
          - project: backend
            dir: projects/boutique-microservices/backend
          - project: gateway
            dir: projects/boutique-microservices/backend/services/gateway
          - project: auth
            dir: projects/boutique-microservices/backend/services/auth
          - project: product-service
            dir: projects/boutique-microservices/backend/services/product-service
          - project: order-service
            dir: projects/boutique-microservices/backend/services/order-service
          - project: orders
            dir: projects/boutique-microservices/backend/services/orders
          - project: user-service
            dir: projects/boutique-microservices/backend/services/user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.dir }}

      - name: Snyk dependency scan
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --fail-on=upgradable
            --file=${{ matrix.dir }}/package.json

  # ============================================================
  # MERGE GATE
  #   Single status check for branch protection. Depends on every
  #   job above. Mandatory jobs must succeed; documented optional
  #   jobs (sonarqube-gate) and fork-skippable jobs (gitleaks,
  #   dependency-scan) may be skipped.
  # ============================================================
  pr-gate:
    name: PR Gate
    if: always()
    needs:
      - gitleaks
      - lint
      - unit-tests
      - trivy-fs
      - docker-build
      - integration-tests
      - sonarqube-gate
      - sast
      - dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job results
        run: |
          failed=0

          # ── Mandatory jobs: must succeed ──
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "unit-tests:${{ needs.unit-tests.result }}" \
            "trivy-fs:${{ needs.trivy-fs.result }}" \
            "docker-build:${{ needs.docker-build.result }}" \
            "integration-tests:${{ needs.integration-tests.result }}" \
            "sast:${{ needs.sast.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" ]]; then
              echo "❌ Mandatory job '$job' did not succeed (result: $result)"
              failed=1
            fi
          done

          # ── Optional / fork-skippable jobs: success or skipped ──
          # sonarqube-gate: optional, controlled by RUN_SONAR_CI var
          # gitleaks: skipped on forked PRs (no GITLEAKS_LICENSE)
          # dependency-scan: skipped on forked PRs (no SNYK_TOKEN)
          for pair in \
            "sonarqube-gate:${{ needs.sonarqube-gate.result }}" \
            "gitleaks:${{ needs.gitleaks.result }}" \
            "dependency-scan:${{ needs.dependency-scan.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "❌ Optional job '$job' failed (result: $result)"
              failed=1
            fi
          done

          if [[ "$failed" -eq 1 ]]; then
            exit 1
          fi
          echo "✅ All required jobs passed"
