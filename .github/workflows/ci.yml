name: Boutique CI Pipeline

on:
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # 1. CODE QUALITY + SECURITY
  # ============================================================
  security-and-quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Secret scanning
      # ----------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            projects/boutique-microservices/frontend/package-lock.json
            projects/boutique-microservices/backend/package-lock.json

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------
      - name: Install frontend dependencies
        run: |
          npm ci --prefix projects/boutique-microservices/frontend

      - name: Install backend dependencies
        run: |
          npm ci --prefix projects/boutique-microservices/backend --legacy-peer-deps

      # ----------------------------------------------------------
      # Type checking
      # ----------------------------------------------------------
      - name: Frontend TypeScript check
        run: npm --prefix projects/boutique-microservices/frontend run typecheck

      - name: Backend TypeScript check
        run: npm --prefix projects/boutique-microservices/backend run typecheck

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------
      - name: Frontend unit tests
        run: |
          CI=true npm \
            --prefix projects/boutique-microservices/frontend \
            run test -- --watch=false --runInBand

      # - name: Backend unit tests
      #   run: |
      #     npm \
      #       --prefix projects/boutique-microservices/backend \
      #       # test

      # ----------------------------------------------------------
      # Semgrep SAST
      # ----------------------------------------------------------
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1"

      # ----------------------------------------------------------
      # Snyk dependency scanning
      # ----------------------------------------------------------
      - name: Run Snyk dependency scan - frontend
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=projects/boutique-microservices/frontend/package.json

      - name: Run Snyk dependency scan - backend
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --file=projects/boutique-microservices/backend/package.json

      # ----------------------------------------------------------
      # SonarQube
      # ----------------------------------------------------------
      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v2.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ----------------------------------------------------------
      # Trivy filesystem scan
      # ----------------------------------------------------------
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,config
          exit-code: "1"

  # ============================================================
  # 2. BUILD + IMAGE SECURITY SCANNING
  # ============================================================
  build-and-scan:
    needs: security-and-quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Determine Docker build context
      # ----------------------------------------------------------
      - name: Build Docker Image
        run: |

          if [ "${{ matrix.service }}" = "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          IMAGE_NAME="${DOCKERHUB_USERNAME}/${{ matrix.service }}:${IMAGE_TAG}"

          echo "Building from: $BUILD_PATH"
          echo "Image: $IMAGE_NAME"

          docker build \
            --tag "$IMAGE_NAME" \
            "$BUILD_PATH"

      # ----------------------------------------------------------
      # Scan the exact image that will eventually be published
      # ----------------------------------------------------------
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          exit-code: "1"

      # ----------------------------------------------------------
      # Save the scanned image
      # ----------------------------------------------------------
      - name: Save Docker image
        run: |

          mkdir -p /tmp/docker-images

          docker save \
            "${DOCKERHUB_USERNAME}/${{ matrix.service }}:${IMAGE_TAG}" \
            -o "/tmp/docker-images/${{ matrix.service }}.tar"

      # ----------------------------------------------------------
      # Upload exact scanned image
      # ----------------------------------------------------------
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/docker-images/${{ matrix.service }}.tar
          retention-days: 1

  # ============================================================
  # 3. PUBLISH TO DOCKER HUB
  # ============================================================
  publish:
    needs: build-and-scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    permissions:
      contents: read

    steps:
      # ----------------------------------------------------------
      # Download exact image that passed Trivy
      # ----------------------------------------------------------
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/docker-images

      # ----------------------------------------------------------
      # Login to Docker Hub
      # ----------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Load and push image
      # ----------------------------------------------------------
      - name: Load and push Docker image
        run: |

          IMAGE_NAME="${DOCKERHUB_USERNAME}/${{ matrix.service }}:${IMAGE_TAG}"

          echo "Loading image..."

          docker load \
            --input "/tmp/docker-images/${{ matrix.service }}.tar"

          echo "Pushing ${IMAGE_NAME}"

          docker push "$IMAGE_NAME"

