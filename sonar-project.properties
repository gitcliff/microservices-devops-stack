sonar.projectKey=gitcliff_microservices-devops-stack
sonar.projectName=Boutique Microservices
sonar.projectVersion=1.0
sonar.organization=gitcliff

# ── Source & test paths ──────────────────────────────────────
sonar.sources=\
  frontend/src,\
  backend/services

sonar.tests=\
  frontend/src,\
  backend/services

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ── Exclusions ───────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.d.ts,\
  **/coverage/**

sonar.coverage.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  **/index.ts,\
  **/index.tsx,\
  **/reportWebVitals.ts,\
  **/setupTests.*

# ── Coverage reports (produced by jest --coverage) ───────────
sonar.javascript.lcov.reportPaths=\
  frontend/coverage/lcov.info,\
  backend/coverage/lcov.info

# ── TypeScript configs ────────────────────────────────────────
sonar.typescript.tsconfigPaths=\
  frontend/tsconfig.json,\
  backend/services/gateway/tsconfig.json,\
  backend/services/auth/tsconfig.json,\
  backend/services/product-service/tsconfig.json,\
  backend/services/orders/tsconfig.json,\
  backend/services/user-service/tsconfig.json

# ── Quality gate ──────────────────────────────────────────────
# Blocks the CI step until SonarQube returns a PASSED/FAILED result
sonar.qualitygate.wait=true

sonar.sourceEncoding=UTF-8
