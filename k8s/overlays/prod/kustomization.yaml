apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  environment: prod

# Prod images are promoted from dev by updating the digests below.
# Use `kustomize edit set image` or copy digests from the dev overlay
# after validating in the dev environment.
#
# Format: <ECR_REGISTRY>/<repo>@sha256:<hash>
images:
  - name: boutique/auth
    newName: PENDING_ECR_REGISTRY/auth
    digest: sha256:PENDING
  - name: boutique/product-service
    newName: PENDING_ECR_REGISTRY/product-service
    digest: sha256:PENDING
  - name: boutique/order-service
    newName: PENDING_ECR_REGISTRY/order-service
    digest: sha256:PENDING
  - name: boutique/orders
    newName: PENDING_ECR_REGISTRY/orders
    digest: sha256:PENDING
  - name: boutique/user-service
    newName: PENDING_ECR_REGISTRY/user-service
    digest: sha256:PENDING
  - name: boutique/gateway
    newName: PENDING_ECR_REGISTRY/gateway
    digest: sha256:PENDING
  - name: boutique/frontend
    newName: PENDING_ECR_REGISTRY/frontend
    digest: sha256:PENDING

patches:
  - path: secrets.yaml
  - path: patches/image-pull-policy.yaml
    target:
      kind: Deployment
  - path: patches/replicas.yaml
  - path: patches/ingress.yaml
