apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boutique-auth
  namespace: boutique
  labels:
    app.kubernetes.io/part-of: boutique
spec:
  selector:
    matchLabels:
      app: auth
  endpoints:
    - port: "3002"
      path: /metrics
      interval: 30s
