apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

commonLabels:
  app.kubernetes.io/part-of: boutique

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - ingress.yaml
  - postgres/init-configmap.yaml
  - postgres/pvc.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - services/auth/deployment.yaml
  - services/product-service/deployment.yaml
  - services/order-service/deployment.yaml
  - services/orders/deployment.yaml
  - services/user-service/deployment.yaml
  - services/gateway/deployment.yaml
  - services/frontend/deployment.yaml
